plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-" + project.mod_version
group = "fr0nick.${project.mod_id}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }

    // Sable Companion: a small, MIT-licensed, standalone compatibility library published by Sable's author.
    // It lets us look up / transform positions for Sable sub-levels without a hard dependency on Sable itself
    // (it safely no-ops via its own bundled default implementation when Sable isn't installed).
    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Maven"
                url = "https://maven.ryanhcode.dev/releases"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

configurations {
    lambJar
    // Catnip's legacy POM references an unpublished Flywheel runtime. These unit
    // tests do not launch Create/Flywheel; leave the actual mod runtime unchanged.
    testRuntimeClasspath {
        exclude group: 'dev.engine_room.flywheel', module: 'flywheel-neoforge-1.21.1'
    }
}

neoForge {
    version = project.neoforge_version

    mods {
        "${project.mod_id}" {
            sourceSet project.sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    // Exact optional engine ABI used by the Portal Lab baseline. Test-only: never bundle or require it.
    testRuntimeOnly('maven.modrinth:scalablelux:9KuFoPhC') { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Read the actual target classfiles for linkage checks, without booting a game.
    testCompileOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.compileClasspath)
    implementation "maven.modrinth:create:${project.create_version}"
    
    implementation "net.createmod.catnip:Catnip-NeoForge-${project.minecraft_version}:0.8.44"
    
    compileOnly "net.createmod.ponder:Ponder-NeoForge-${project.minecraft_version}:1.0.46"
    
    lambJar("maven.modrinth:lambdynamiclights:${project.lambdynlights_version}") {
        transitive = false
    }
    compileOnly files({
        zipTree(configurations.lambJar.singleFile).matching {
            include 'META-INF/jars/*-neoforge.jar'
        }
    })
    
    compileOnly "maven.modrinth:sable:${project.sable_version}"

    // Bundled (Jar-in-Jar) so it's always present at runtime, even without Sable installed; NeoForge's JiJ
    // dependency resolution will deduplicate against Sable's own bundled copy when both are present, picking
    // whichever version satisfies both ranges (same pattern Sable itself uses for this exact library).
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:[${project.sable_companion_version},)")) {
        version {
            prefer project.sable_companion_version
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            neoforge_version       : project.neoforge_version,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '512m'
    maxParallelForks = 1
    testLogging { events 'passed', 'skipped', 'failed' }
}
